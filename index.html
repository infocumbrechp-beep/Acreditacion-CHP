<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Registro y Pase Digital — CHP 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    --bg:#0A1628; --card:#111E35; --line:rgba(255,255,255,.10);
    --text:#E8F0FF; --muted:#8CA3C2; --blue:#1565C8;
    --green:#1A7A4A; --orange:#D4700A; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  .container { width:100%; max-width:460px; margin:0 auto; padding:20px 18px; }
  .hidden { display:none !important; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:22px; box-shadow:var(--shadow); }
  .title { font-family:'Syne',sans-serif; font-size:28px; text-align:center; margin-bottom:8px; font-weight:800; }
  .sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px; line-height:1.5; }
  
  .form-group { margin-bottom:14px; text-align:left; }
  label { display:block; margin-bottom:6px; font-size:13px; color:#B9CAE0; font-weight:600; }
  input, select { width:100%; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:var(--text); font-size:16px; outline:none; }
  
  .btn-main { width:100%; border:none; border-radius:14px; padding:16px; font-weight:800; font-family:'Syne',sans-serif; background:linear-gradient(135deg,#1565C8,#2E86F5); color:#fff; cursor:pointer; margin-top:10px; transition: 0.2s; }
  .btn-main:active { transform: scale(0.98); }
  
  /* Dashboard y Menú */
  .card-pase { border-radius:28px; padding:20px; text-align:center; color:#fff; position: relative; overflow: hidden; }
  #qrcode { background:#fff; padding:10px; border-radius:18px; display:inline-block; margin:15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .user-name { font-family:'Syne',sans-serif; font-size:24px; margin:5px 0; line-height:1.2; }
  
  .menu-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:20px; }
  .menu-item { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 10px; text-align:center; cursor:pointer; }
  .menu-icon { font-size:26px; margin-bottom:8px; display:block; }
  .menu-text { font-size:13px; font-weight:700; }

  .msg { display:none; padding:12px; border-radius:12px; margin-top:10px; font-size:13px; text-align:center; }
  .msg.error { display:block; background:rgba(180,35,24,.2); border:1px solid #b42318; color:#FFD9D6; }
</style>
</head>
<body>

<div id="registro-screen" class="container">
  <img src="assets/logo-light.jpg" style="width:120px; display:block; margin:0 auto 15px;" onerror="this.style.display='none'">
  <h1 class="title">Registro CHP 2026</h1>
  <p class="sub">Completa tus datos para activar tu plataforma del asistente.</p>
  
  <div class="panel">
    <div class="form-group">
      <label>Nombre y Apellido</label>
      <input type="text" id="reg-nombre" placeholder="Ej. Jenny Lopez">
    </div>
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" id="reg-correo" placeholder="correo@ejemplo.com">
    </div>
    <div class="form-group">
      <label>Teléfono (WhatsApp)</label>
      <input type="tel" id="reg-telefono" placeholder="+58 412 0000000">
    </div>
    <div class="form-group">
      <label>Categoría Profesional</label>
      <select id="reg-profesion">
        <option value="">Selecciona...</option>
        <option value="Médico">Médico</option>
        <option value="Enfermero/a">Enfermero/a</option>
        <option value="Estudiante">Estudiante</option>
        <option value="Otros">Otros / Expositores</option>
      </select>
    </div>
    <button id="btn-registrar" onclick="procesarRegistro()" class="btn-main">ACTIVAR MI PASE</button>
    <div id="form-msg" class="msg"></div>
  </div>
</div>

<div id="dashboard" class="container hidden">
  <div id="captura-area">
    <div class="card-pase" id="card-color">
      <div id="qrcode"></div>
      <h2 id="user-display-name" class="user-name"></h2>
      <div id="user-display-prof" style="font-weight:700; opacity:0.9; font-size:13px; letter-spacing:1px;"></div>
      <div id="user-display-uid" style="font-family:monospace; font-size:11px; margin-top:8px; opacity:0.6;"></div>
    </div>
  </div>

  <div class="menu-grid">
    <div class="menu-item" onclick="abrirSeccion('programa')">
      <span class="menu-icon">📅</span><span class="menu-text">Programa</span>
    </div>
    <div class="menu-item" onclick="abrirSeccion('conferencias')">
      <span class="menu-icon">✅</span><span class="menu-text">Asistencia</span>
    </div>
    <div class="menu-item" onclick="abrirSeccion('talleres')">
      <span class="menu-icon">🎓</span><span class="menu-text">Talleres Pago</span>
    </div>
    <div class="menu-item" onclick="descargarPase()">
      <span class="menu-icon">📥</span><span class="menu-text">Guardar Pase</span>
    </div>
  </div>

  <button class="btn-main" style="background:rgba(255,255,255,0.06); border:1px solid var(--line); margin-top:30px;" onclick="cerrarSesion()">CERRAR SESIÓN</button>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9dWj8Ea6OFJZSGiOHTMjNxNF-ZhojhJ49vBTXyzKFMO4Yv_ufRQLY5bEFEcJgwY7eyQ/exec";
  const STORAGE_KEY = "chp_session_v26";

  async function procesarRegistro() {
    const nombre = document.getElementById("reg-nombre").value.trim();
    const email = document.getElementById("reg-correo").value.toLowerCase().trim();
    const telf = document.getElementById("reg-telefono").value.trim();
    const prof = document.getElementById("reg-profesion").value;
    const msg = document.getElementById("form-msg");
    const btn = document.getElementById("btn-registrar");

    if(!nombre || !email || !prof) {
      msg.className = "msg error"; msg.textContent = "Por favor, completa los campos.";
      return;
    }

    btn.disabled = true; btn.textContent = "CONECTANDO...";

    const uid = "CHP-" + Math.random().toString(36).substr(2, 5).toUpperCase();
    const datos = { action: "register", nombre, email, telefono: telf, especialidad: prof, uid };

    try {
      // Envío al Apps Script
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(datos) });
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(datos));
      mostrarDashboard(datos);
    } catch (e) {
      msg.className = "msg error"; msg.textContent = "Error de red. Intenta de nuevo.";
    } finally {
      btn.disabled = false; btn.textContent = "ACTIVAR MI PASE";
    }
  }

  function mostrarDashboard(user) {
    document.getElementById("registro-screen").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    
    const card = document.getElementById("card-color");
    if(user.especialidad.includes("Enfermero")) card.style.background = "linear-gradient(135deg, #D4700A, #FF914D)";
    else if(user.especialidad.includes("Estudiante")) card.style.background = "linear-gradient(135deg, #1A7A4A, #2ECC71)";
    else card.style.background = "linear-gradient(135deg, #1A5276, #2980B9)";

    document.getElementById("user-display-name").textContent = user.nombre.toUpperCase();
    document.getElementById("user-display-prof").textContent = user.especialidad.toUpperCase();
    document.getElementById("user-display-uid").textContent = "ID ÚNICO: " + user.uid;

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: JSON.stringify({uid: user.uid, n: user.nombre, e: user.especialidad, t: user.telefono, m: user.email}),
      width: 160, height: 160
    });
  }

  function abrirSeccion(tipo) {
    if(tipo === 'programa') alert("Cargando Programa Oficial...");
    if(tipo === 'talleres') alert("Redirigiendo a Talleres de Pago...");
    if(tipo === 'conferencias') alert("La validación de asistencia se activará el día del evento.");
  }

  async function descargarPase() {
    const area = document.getElementById("captura-area");
    const canvas = await html2canvas(area);
    const link = document.createElement("a");
    link.download = "Pase_CHP2026.png";
    link.href = canvas.toDataURL();
    link.click();
  }

  function cerrarSesion() {
    if(confirm("¿Quieres salir? Tu pase seguirá guardado en la base de datos.")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  window.onload = () => {
    const session = localStorage.getItem(STORAGE_KEY);
    if(session) mostrarDashboard(JSON.parse(session));
  }
</script>
</body>
</html>
